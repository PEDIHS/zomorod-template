name: Apply reseller scope fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped reseller fix
        run: |
          python3 tools/apply_reseller_scope_fix.py
          python3 -m py_compile backend/zomorod_admin_subscriptions.py
          grep -q 'def _has_profile_overrides' backend/zomorod_admin_subscriptions.py
          grep -q 'async def scoped_standard_subscription(' backend/zomorod_admin_subscriptions.py
          grep -q 'response.headers\["profile-title"\] = encode_title' backend/zomorod_admin_subscriptions.py

      - name: Commit backend fix
        run: |
          if git diff --quiet -- backend/zomorod_admin_subscriptions.py; then
            echo 'Scoped reseller fix is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/zomorod_admin_subscriptions.py
          git commit -m 'fix: scope reseller branding to owned subscriptions [skip scope-fix]'
          git push origin HEAD:main
