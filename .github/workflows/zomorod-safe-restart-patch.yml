name: Zomorod safe restart patch

on:
  push:
    paths:
      - '.github/patches/zomorod-safe-restart.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe PasarGuard restart patch
        run: python3 .github/patches/zomorod-safe-restart.py
      - name: Validate patch
        run: |
          bash -n install.sh
          grep -q 'pasarguard_cli="$(command -v pasarguard)"' install.sh
          grep -q '"${pasarguard_cli}" restart' install.sh
          grep -q -- '--no-restart' install.sh
          ! grep -En 'docker[[:space:]]+(restart|stop|kill|rm)|docker[[:space:]]+compose[^\n]*(up|down|restart|stop|kill|rm)' install.sh plugin/integrate-dashboard.sh
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh
          git commit -m 'feat: safely restart PasarGuard after Zomorod integration [skip ci]'
          git push origin HEAD:main
