name: Apply canonical admin subscription links v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/zomorod_admin_subscriptions.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('from urllib.parse import urlparse\n','from urllib.parse import urlparse, urlsplit, urlunsplit\n',1)
          s=s.replace('from sqlalchemy import select\n','from sqlalchemy import func, select\n',1)
          s=s.replace('from app.db.models import Admin\n','from app.db.models import Admin, User\n',1)
          if 'from app.operation.user import UserOperation\n' not in s:
              s=s.replace('from app.operation.subscription import SubscriptionOperation\n','from app.operation.subscription import SubscriptionOperation\nfrom app.operation.user import UserOperation\n',1)
          old='async def _admin_rows(db: AsyncSession) -> list[dict]:\n    rows = (await db.execute(select(Admin.id, Admin.username).order_by(Admin.username.asc()))).all()\n    return [{"id": int(admin_id), "username": username} for admin_id, username in rows]\n'
          new='async def _admin_rows(db: AsyncSession) -> list[dict]:\n    rows = (\n        await db.execute(\n            select(Admin.id, Admin.username, func.count(User.id).label("user_count"))\n            .outerjoin(User, User.admin_id == Admin.id)\n            .group_by(Admin.id, Admin.username)\n            .order_by(Admin.username.asc())\n        )\n    ).all()\n    return [{"id": int(a), "username": u, "user_count": int(n or 0)} for a, u, n in rows]\n'
          if old in s: s=s.replace(old,new,1)
          elif 'func.count(User.id)' not in s: raise SystemExit('admin rows anchor missing')
          if '# Zomorod canonical subscription URL patch' not in s:
              lines=['','# Zomorod canonical subscription URL patch','def _namespace_url_for_admin(url: str, admin_id: int) -> str:','    namespace = _namespace_for_admin(admin_id)','    if not namespace or not namespace.get("enabled", True): return url','    parsed = urlsplit(url)','    segments = parsed.path.split("/")','    sub_segment = subscription_env_settings.path.strip("/")','    indexes = [i for i, segment in enumerate(segments) if segment == sub_segment]','    if not indexes: return url','    sub_index = indexes[-1]','    tail = [segment for segment in segments[sub_index + 1 :] if segment]','    if len(tail) != 1: return url','    segments.insert(sub_index + 1, str(namespace["slug"]))','    return urlunsplit((parsed.scheme, parsed.netloc, "/".join(segments), parsed.query, parsed.fragment))','','','def _install_subscription_url_namespace_patch() -> None:','    native_attr = "_zomorod_native_generate_subscription_url"','    native = getattr(UserOperation, native_attr, None)','    if native is None:','        native = UserOperation.generate_subscription_url','        setattr(UserOperation, native_attr, native)','    current = UserOperation.generate_subscription_url','    if getattr(current, "_zomorod_namespace_patch", False): return','    async def generate_subscription_url(user):','        url = await native(user)','        admin = getattr(user, "admin", None)','        admin_id = int(getattr(admin, "id", 0) or 0)','        if admin_id <= 0: return url','        return _namespace_url_for_admin(url, admin_id)','    generate_subscription_url._zomorod_namespace_patch = True','    UserOperation.generate_subscription_url = staticmethod(generate_subscription_url)','','','_install_subscription_url_namespace_patch()']
              s=s.rstrip()+'\n'+'\n'.join(lines)+'\n'
          p.write_text(s,encoding='utf-8')

          p=Path('plugin/zomorod-special.js'); js=p.read_text(encoding='utf-8')
          old='    const options = admins.map((admin) => `<option value="${escapeHtml(admin.id)}" data-username="${escapeHtml(admin.username)}">${escapeHtml(admin.username)}</option>`).join(\'\');'
          new='    const options = admins.map((admin) => `<option value="${escapeHtml(admin.id)}" data-username="${escapeHtml(admin.username)}" data-user-count="${escapeHtml(Number(admin.user_count || 0))}">${escapeHtml(admin.username)} · ${escapeHtml(Number(admin.user_count || 0))} users</option>`).join(\'\');'
          if old in js: js=js.replace(old,new,1)
          elif 'data-user-count=' not in js: raise SystemExit('options anchor missing')
          old='      return `<div class="z-ns-row" data-z-route="${escapeHtml(route.slug)}"><div class="z-ns-admin">${escapeHtml(route.username)}</div><div class="z-ns-url" title="${escapeHtml(example)}">${escapeHtml(example)}</div><button type="button" class="z-mini-btn z-copy-ns" data-prefix="${escapeHtml(`${location.origin}${route.path_prefix}/`)}">Copy Prefix</button><button type="button" class="z-mini-btn z-danger z-delete-ns" data-slug="${escapeHtml(route.slug)}">Delete</button></div>`;'
          new='      const admin = admins.find((item) => Number(item.id) === Number(route.admin_id));\n      const userCount = Number(admin?.user_count || 0);\n      return `<div class="z-ns-row" data-z-route="${escapeHtml(route.slug)}"><div class="z-ns-admin">${escapeHtml(route.username)} <span class="z-native">${escapeHtml(userCount)} users</span></div><div class="z-ns-url" title="${escapeHtml(example)}">${escapeHtml(example)}</div>${userCount === 0 ? \'<div class="z-pending">این ادمین فعلاً هیچ User تحت مالکیت خود ندارد؛ ابتدا در PasarGuard برای Userها Set Owner انجام دهید.</div>\' : \'\'}<button type="button" class="z-mini-btn z-copy-ns" data-prefix="${escapeHtml(`${location.origin}${route.path_prefix}/`)}">Copy Prefix</button><button type="button" class="z-mini-btn z-danger z-delete-ns" data-slug="${escapeHtml(route.slug)}">Delete</button></div>`;'
          if old in js: js=js.replace(old,new,1)
          elif 'userCount === 0' not in js: raise SystemExit('row anchor missing')
          old="        await api('/api/zomorod/admin-subscriptions', { method: 'POST', body: JSON.stringify({ admin_id: Number(select.value), slug: slug.value.trim(), enabled: true }) });\n        cachedNamespaces = await api('/api/zomorod/admin-subscriptions');\n        namespaceError = null;\n        if (cachedSettings) renderOwner(cachedSettings);"
          new="        const selectedAdmin = cachedNamespaces?.admins?.find((item) => Number(item.id) === Number(select.value));\n        await api('/api/zomorod/admin-subscriptions', { method: 'POST', body: JSON.stringify({ admin_id: Number(select.value), slug: slug.value.trim(), enabled: true }) });\n        cachedNamespaces = await api('/api/zomorod/admin-subscriptions');\n        namespaceError = null;\n        if (cachedSettings) renderOwner(cachedSettings);\n        if (Number(selectedAdmin?.user_count || 0) === 0) alert('Namespace ذخیره شد، اما این ادمین هیچ User تحت مالکیت خودش ندارد. ابتدا Userهای موردنظر را در PasarGuard با Set Owner به این ادمین منتقل کنید.');"
          if old in js: js=js.replace(old,new,1)
          elif 'selectedAdmin?.user_count' not in js: raise SystemExit('save anchor missing')
          p.write_text(js,encoding='utf-8')
          PY
          python3 -m py_compile backend/zomorod_admin_subscriptions.py
          node --check plugin/zomorod-special.js
      - name: Commit fix
        run: |
          if git diff --quiet -- backend/zomorod_admin_subscriptions.py plugin/zomorod-special.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/zomorod_admin_subscriptions.py plugin/zomorod-special.js
          git commit -m 'fix: generate canonical admin-scoped subscription links [skip canonical-fix]'
          git push origin HEAD:main
