name: Patch Zomorod restart no logs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-restart-no-logs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch installer restart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install.sh')
          s = p.read_text(encoding='utf-8')
          old = 'if ! "${pasarguard_cli}" restart; then'
          new = 'if ! "${pasarguard_cli}" restart --no-logs; then'
          if old not in s:
              raise SystemExit('restart patch anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n install.sh
      - name: Commit installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use non-following official PasarGuard restart'
          git push origin HEAD:main
