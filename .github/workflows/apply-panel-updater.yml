name: Apply in-panel updater

on:
  push:
    branches: [main]
    paths:
      - tools/apply_panel_updater.py
      - .github/workflows/apply-panel-updater.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply updater feature
        run: |
          python3 tools/apply_panel_updater.py
          chmod +x plugin/update-from-panel.sh
          python3 -m py_compile backend/zomorod_admin_subscriptions.py
          node --check plugin/zomorod-special.js
          bash -n install.sh
          bash -n plugin/update-from-panel.sh
      - name: Commit feature
        run: |
          rm -f tools/apply_panel_updater.py .github/workflows/apply-panel-updater.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add owner in-panel Zomorod updater'
          git push origin HEAD:main
