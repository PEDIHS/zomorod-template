          git push origin HEAD:main
 systemd/zomorod-integrator.timer
          grep -q 'REFRESH_INTERVAL_MS = 5 \* 60 \* 1000' plugin/zomorod-runtime.js
          ! grep -q 'setInterval(scheduleApply' plugin/zomorod-runtime.js
          grep -q 'domObserver?.disconnect()' plugin/zomorod-runtime.js
          grep -q 'uiObserver?.disconnect()' plugin/zomorod-special.js
          grep -q '_ROUTES_CACHE' backend/zomorod_admin_subscriptions.py
          grep -q '_load_state(mutable=True)' backend/zomorod_admin_subscriptions.py

