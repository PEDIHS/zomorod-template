name: Zomorod CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build subscription UI
        run: bun run build
        env:
          VITE_FALLBACK_LANGUAGE: fa

      - name: Validate browser integration JavaScript
        run: |
          node --check plugin/zomorod-special.js
          node --check plugin/zomorod-runtime.js

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n plugin/integrate-dashboard.sh

      - name: Validate required artifacts
        run: |
          test -s dist/index.html
          test -s plugin/zomorod-special.js
          test -s plugin/zomorod-runtime.js
          test -s systemd/zomorod-integrator.service
          test -s systemd/zomorod-integrator.path
          test -s systemd/zomorod-integrator.timer
