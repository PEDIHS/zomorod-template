name: Zomorod CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build subscription UI
        run: bun run build
        env:
          VITE_FALLBACK_LANGUAGE: fa

      - name: Upload built subscription template
        uses: actions/upload-artifact@v4
        with:
          name: zomorod-built-template
          path: dist/index.html
          if-no-files-found: error
          retention-days: 3

      - name: Validate browser integration JavaScript
        run: |
          node --check plugin/zomorod-special.js
          node --check plugin/zomorod-runtime.js
          grep -q '/api/zomorod/profile' plugin/zomorod-special.js
          grep -q 'support-id-b64' plugin/zomorod-special.js
          grep -q 'zomorod-support-link' plugin/zomorod-runtime.js
          grep -q '/api/zomorod/update-status' plugin/zomorod-special.js
          grep -q '/api/zomorod/update' plugin/zomorod-special.js
          grep -q 'UPDATE_NOTICE_ID' plugin/zomorod-special.js
          grep -q 'showConfigs: true' plugin/zomorod-special.js
          grep -q 'showConfigs: true' plugin/zomorod-runtime.js
          grep -q '/api/zomorod/appearance' plugin/zomorod-special.js
          grep -q 'data-color-plane' plugin/zomorod-special.js
          grep -q 'zomorod-theme-style' plugin/zomorod-runtime.js
          grep -q 'theme-primary' plugin/zomorod-runtime.js
          grep -q 'treasury-gold-foreground' plugin/zomorod-runtime.js
          grep -q 'treasury-emerald-foreground' plugin/zomorod-runtime.js
          grep -q '\[role="tablist"\]' plugin/zomorod-special.js

      - name: Guard complete theme coverage and semantic colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('src/index.css').read_text()
          treasury = css[css.index('/* Emerald Treasury'):]

          # These were legacy hard-coded brand shades. They must never appear
          # in Treasury component rules again; only the five palette defaults
          # at the top of .treasury-shell may be literal.
          body = treasury[treasury.index('--treasury-ivory:'):]
          forbidden = [
              '#07563f', '#034433', '#022e24', '#f2ca61', '#f3d274',
              '#c99425', '#b47c16', '#efcc68', '#f3c953', '#e6a91e',
              '#f3d576', '#f0d27a', '#e1b547', '#edca68', '#be8b21',
              '#f0ce6e', '#bf8b21', '#086149', '#034534', '#022f25',
              '#f0cc6a', '#e8c65f', '#f0cf72', '#087153', '#034333',
          ]
          lowered = body.lower()
          found = [value for value in forbidden if value in lowered]
          if found:
              raise SystemExit(f'Legacy hard-coded Treasury brand colors remain: {found}')

          ping_match = re.search(r'\.treasury-server-ping\s*\{([^}]*)\}', css, re.S)
          if not ping_match:
              raise SystemExit('Ping style block not found')
          ping = ping_match.group(1)
          if 'var(--success)' not in ping:
              raise SystemExit('Ping must remain tied to semantic --success color')
          if '--treasury-' in ping or 'var(--primary)' in ping or 'var(--secondary)' in ping:
              raise SystemExit('Ping must not inherit customizable brand colors')

          required = [
              '.treasury-hero', '.treasury-orbit', '.treasury-quick-action',
              '.treasury-subscription-card', '.treasury-support-button',
              '--treasury-gold-foreground', '--treasury-emerald-foreground',
          ]
          missing = [item for item in required if item not in css]
          if missing:
              raise SystemExit(f'Missing theme-aware Treasury coverage: {missing}')

          runtime = Path('plugin/zomorod-runtime.js').read_text().lower()
          legacy_runtime = [
              'rgba(16,185,129', 'rgba(184,134,11', 'rgba(6,95,70',
              '#047857', '#059669', '#065f46', '#6ee7b7',
          ]
          found_runtime = [value for value in legacy_runtime if value in runtime]
          if found_runtime:
              raise SystemExit(f'Runtime still contains fixed brand accents: {found_runtime}')
          PY
          grep -q 'querySelectorAll(tabSelector).length >= 1' plugin/zomorod-special.js
          grep -q 'normalizeConfigLinks' src/hooks/useUserData.ts
          grep -q '/raw' src/hooks/useUserData.ts
          grep -q 'getSubscriptionPath' src/hooks/useUserData.ts
          grep -Fq 'rawData?.body?.links' src/hooks/useUserData.ts

      - name: Validate Python backend addon
        run: |
          python3 -m py_compile backend/zomorod_admin_subscriptions.py
          grep -q 'admin_slug:zslug' backend/zomorod_admin_subscriptions.py
          grep -q 'db_user.*admin_id' backend/zomorod_admin_subscriptions.py
          grep -q 'role.is_owner' backend/zomorod_admin_subscriptions.py
          grep -q '/api/zomorod/profile' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_STORE_NAME' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_SUPPORT_ID' backend/zomorod_admin_subscriptions.py
          grep -q 'db_admin.profile_title = None' backend/zomorod_admin_subscriptions.py
          grep -q 'db_admin.support_url = None' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_SHOW_CONFIGS' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_THEME_PRIMARY' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_THEME_SECONDARY' backend/zomorod_admin_subscriptions.py
          grep -q 'ZOMOROD_PROFILE_VARIABLE_KEYS' backend/zomorod_admin_subscriptions.py
          grep -q '/api/zomorod/appearance' backend/zomorod_admin_subscriptions.py
          grep -q '"show_configs": True' backend/zomorod_admin_subscriptions.py
          grep -q '/api/zomorod/update-status' backend/zomorod_admin_subscriptions.py
          grep -q '/api/zomorod/update' backend/zomorod_admin_subscriptions.py
          grep -q 'UPDATE_REQUEST_FILE' backend/zomorod_admin_subscriptions.py
          grep -q 'Depends(_require_owner)' backend/zomorod_admin_subscriptions.py
          if grep -Eq 'db_admin\.profile_title[[:space:]]*=[[:space:]]*model|db_admin\.support_url[[:space:]]*=[[:space:]]*support' backend/zomorod_admin_subscriptions.py; then
            echo 'Reseller Zomorod profile must not mutate native PasarGuard branding fields.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('backend/zomorod_admin_subscriptions.py')
          tree = ast.parse(path.read_text())
          assigned = set()
          used = set()
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id.startswith('VAR_'):
                          assigned.add(target.id)
              if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load) and node.id.startswith('VAR_'):
                  used.add(node.id)
          missing = sorted(used - assigned)
          if missing:
              raise SystemExit(f'Undefined Zomorod variable constants: {missing}')
          PY

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n plugin/integrate-dashboard.sh
          bash -n plugin/update-from-panel.sh

      - name: Guard low-CPU reconciliation model
        run: |
          grep -q '^Type=oneshot      - name: Enforce official-only PasarGuard restart safety
        run: |
          set -euo pipefail
          files=(install.sh plugin/integrate-dashboard.sh plugin/update-from-panel.sh)
          forbidden='docker[[:space:]]+(restart|stop|kill|rm)([[:space:]]|$)|docker[[:space:]]+compose[^\n]*(up|down|restart|stop|kill|rm)([[:space:]]|$)|pasarguard[[:space:]]+(down|up)([[:space:]]|$)|systemctl[[:space:]]+restart[[:space:]]+pasarguard'
          if grep -En "$forbidden" "${files[@]}"; then
            echo 'Unsafe direct service lifecycle command found in install/integration path.' >&2
            exit 1
          fi
          grep -q 'pasarguard_cli' install.sh
          grep -q 'restart' install.sh
          grep -q -- '--no-restart' install.sh
          grep -q 'ZOMOROD_CLI.*update' plugin/update-from-panel.sh

      - name: Test self-healing integration idempotency
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT

          mkdir -p "$sandbox/pasarguard/dashboard/build/statics"
          mkdir -p "$sandbox/pasarguard/app/routers"
          mkdir -p "$sandbox/zomorod/plugin" "$sandbox/zomorod/backend"
          mkdir -p "$sandbox/templates/subscription"

          cp plugin/zomorod-special.js "$sandbox/zomorod/plugin/zomorod-special.js"
          cp plugin/zomorod-runtime.js "$sandbox/zomorod/plugin/zomorod-runtime.js"
          cp plugin/integrate-dashboard.sh "$sandbox/zomorod/plugin/integrate-dashboard.sh"
          cp backend/zomorod_admin_subscriptions.py "$sandbox/zomorod/backend/zomorod_admin_subscriptions.py"
          chmod +x "$sandbox/zomorod/plugin/integrate-dashboard.sh"

          printf '<!doctype html><html><head></head><body>dashboard</body></html>\n' > "$sandbox/pasarguard/dashboard/build/index.html"
          cp "$sandbox/pasarguard/dashboard/build/index.html" "$sandbox/pasarguard/dashboard/build/404.html"
          printf '<!doctype html><html><body>subscription</body></html>\n' > "$sandbox/templates/subscription/index.html"
          cat > "$sandbox/pasarguard/app/routers/__init__.py" <<'PY'
          from fastapi import APIRouter
          api_router = APIRouter()
          routers = []
          for router in routers:
              api_router.include_router(router)
          PY

          sudo env \
            ZOMOROD_ROOT="$sandbox/zomorod" \
            PASARGUARD_ROOT="$sandbox/pasarguard" \
            SUB_TEMPLATE="$sandbox/templates/subscription/index.html" \
            "$sandbox/zomorod/plugin/integrate-dashboard.sh"

          first_dashboard_sha="$(sha256sum "$sandbox/pasarguard/dashboard/build/index.html" | awk '{print $1}')"
          first_subscription_sha="$(sha256sum "$sandbox/templates/subscription/index.html" | awk '{print $1}')"

          sudo env \
            ZOMOROD_ROOT="$sandbox/zomorod" \
            PASARGUARD_ROOT="$sandbox/pasarguard" \
            SUB_TEMPLATE="$sandbox/templates/subscription/index.html" \
            "$sandbox/zomorod/plugin/integrate-dashboard.sh"

          second_dashboard_sha="$(sha256sum "$sandbox/pasarguard/dashboard/build/index.html" | awk '{print $1}')"
          second_subscription_sha="$(sha256sum "$sandbox/templates/subscription/index.html" | awk '{print $1}')"

          test "$first_dashboard_sha" = "$second_dashboard_sha"
          test "$first_subscription_sha" = "$second_subscription_sha"
          test "$(grep -c 'zomorod-special-loader' "$sandbox/pasarguard/dashboard/build/index.html")" -eq 1
          test "$(grep -c 'zomorod-runtime-inline' "$sandbox/templates/subscription/index.html")" -eq 1
          test "$(grep -c 'zomorod-admin-subscriptions-start' "$sandbox/pasarguard/app/routers/__init__.py")" -eq 1
          test "$(grep -c 'zomorod_admin_subscriptions.router' "$sandbox/pasarguard/app/routers/__init__.py")" -eq 1
          cmp plugin/zomorod-special.js "$sandbox/pasarguard/dashboard/build/statics/zomorod-special.js"
          cmp backend/zomorod_admin_subscriptions.py "$sandbox/pasarguard/app/routers/zomorod_admin_subscriptions.py"

      - name: Validate installer help
        run: bash install.sh --help >/dev/null

      - name: Validate required artifacts
        run: |
          test -s dist/index.html
          test -s plugin/zomorod-special.js
          test -s plugin/zomorod-runtime.js
          test -s plugin/update-from-panel.sh
          test -s backend/zomorod_admin_subscriptions.py
          test -s systemd/zomorod-integrator.service
          test -s systemd/zomorod-integrator.path
          test -s systemd/zomorod-integrator.timer
          test -s systemd/zomorod-panel-update.service
          test -s systemd/zomorod-panel-update.path

      - name: Refresh installer prebuilt from validated build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gzip -9 -n -c dist/index.html > "$tmp/index.html.gz"
          rm -f prebuilt/index.html.gz.part-*
          split -b 50000 -d -a 2 "$tmp/index.html.gz" prebuilt/index.html.gz.part-
          count="$(find prebuilt -maxdepth 1 -type f -name 'index.html.gz.part-*' | wc -l | tr -d ' ')"
          printf '%s\n' "$count" > prebuilt/index.parts

          if git diff --quiet -- prebuilt; then
            echo 'Prebuilt already matches validated build.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt
          git commit -m 'build: refresh installer prebuilt from validated template [skip ci]'
          git push origin HEAD:main
 systemd/zomorod-integrator.service
          ! grep -Eq 'while[[:space:]]+true|sleep[[:space:]]+60' systemd/zomorod-integrator.service
          grep -q '^OnUnitInactiveSec=15min      - name: Enforce official-only PasarGuard restart safety
        run: |
          set -euo pipefail
          files=(install.sh plugin/integrate-dashboard.sh plugin/update-from-panel.sh)
          forbidden='docker[[:space:]]+(restart|stop|kill|rm)([[:space:]]|$)|docker[[:space:]]+compose[^\n]*(up|down|restart|stop|kill|rm)([[:space:]]|$)|pasarguard[[:space:]]+(down|up)([[:space:]]|$)|systemctl[[:space:]]+restart[[:space:]]+pasarguard'
          if grep -En "$forbidden" "${files[@]}"; then
