          test "$(grep -c 'zomorod-runtime-inline' "$sandbox/templates/subscription/index.html")" -eq 1
          test "$(grep -c 'zomorod-admin-subscriptions-start' "$sandbox/pasarguard/app/routers/__init__.py")" -eq 1
          test "$(grep -c 'zomorod_admin_subscriptions.router' "$sandbox/pasarguard/app/routers/__init__.py")" -eq 1
          cmp plugin/zomorod-special.js "$sandbox/pasarguard/dashboard/build/statics/zomorod-special.js"
          cmp backend/zomorod_admin_subscriptions.py "$sandbox/pasarguard/app/routers/zomorod_admin_subscriptions.py"

      - name: Validate installer help
        run: bash install.sh --help >/dev/null

      - name: Validate required artifacts
        run: |
          test -s dist/index.html
          test -s plugin/zomorod-special.js
          test -s plugin/zomorod-runtime.js
          test -s plugin/update-from-panel.sh
          test -s backend/zomorod_admin_subscriptions.py
          test -s systemd/zomorod-integrator.service
          test -s systemd/zomorod-integrator.path
          test -s systemd/zomorod-integrator.timer
          test -s systemd/zomorod-panel-update.service
          test -s systemd/zomorod-panel-update.path

      - name: Refresh installer prebuilt from validated build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gzip -9 -n -c dist/index.html > "$tmp/index.html.gz"
          rm -f prebuilt/index.html.gz.part-*
          split -b 50000 -d -a 2 "$tmp/index.html.gz" prebuilt/index.html.gz.part-
          count="$(find prebuilt -maxdepth 1 -type f -name 'index.html.gz.part-*' | wc -l | tr -d ' ')"
          printf '%s\n' "$count" > prebuilt/index.parts

          if git diff --quiet -- prebuilt; then
            echo 'Prebuilt already matches validated build.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt
          git commit -m 'build: refresh installer prebuilt from validated template [skip ci]'
          git push origin HEAD:main
