name: Apply canonical admin subscription links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend and Zomorod UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('backend/zomorod_admin_subscriptions.py')
          s = backend.read_text(encoding='utf-8')
          s = s.replace('from urllib.parse import urlparse\n', 'from urllib.parse import urlparse, urlsplit, urlunsplit\n', 1)
          s = s.replace('from sqlalchemy import select\n', 'from sqlalchemy import func, select\n', 1)
          s = s.replace('from app.db.models import Admin\n', 'from app.db.models import Admin, User\n', 1)
          if 'from app.operation.user import UserOperation\n' not in s:
              s = s.replace('from app.operation.subscription import SubscriptionOperation\n', 'from app.operation.subscription import SubscriptionOperation\nfrom app.operation.user import UserOperation\n', 1)

          old_admin_rows = '''async def _admin_rows(db: AsyncSession) -> list[dict]:\n    rows = (await db.execute(select(Admin.id, Admin.username).order_by(Admin.username.asc()))).all()\n    return [{"id": int(admin_id), "username": username} for admin_id, username in rows]\n'''
          new_admin_rows = '''async def _admin_rows(db: AsyncSession) -> list[dict]:\n    rows = (\n        await db.execute(\n            select(Admin.id, Admin.username, func.count(User.id).label("user_count"))\n            .outerjoin(User, User.admin_id == Admin.id)\n            .group_by(Admin.id, Admin.username)\n            .order_by(Admin.username.asc())\n        )\n    ).all()\n    return [\n        {"id": int(admin_id), "username": username, "user_count": int(user_count or 0)}\n        for admin_id, username, user_count in rows\n    ]\n'''
          if old_admin_rows in s:
              s = s.replace(old_admin_rows, new_admin_rows, 1)
          elif 'func.count(User.id).label("user_count")' not in s:
              raise SystemExit('expected _admin_rows block not found')

          marker = '# Zomorod canonical subscription URL patch'
          if marker not in s:
              patch = r'''

# Zomorod canonical subscription URL patch
# PasarGuard's dashboard, QR actions, Telegram notifications and bulk-create
# responses all consume UserOperation.generate_subscription_url().  Rewrite
# that canonical URL only when the user's real owner has an enabled namespace.
def _namespace_url_for_admin(url: str, admin_id: int) -> str:
    namespace = _namespace_for_admin(admin_id)
    if not namespace or not namespace.get("enabled", True):
        return url

    parsed = urlsplit(url)
    segments = parsed.path.split("/")
    sub_segment = subscription_env_settings.path.strip("/")
    indexes = [index for index, segment in enumerate(segments) if segment == sub_segment]
    if not indexes:
        return url

    sub_index = indexes[-1]
    tail = [segment for segment in segments[sub_index + 1 :] if segment]
    # Rewrite only the native /sub/<token> shape. Namespaced/client/info URLs
    # must never be namespaced twice.
    if len(tail) != 1:
        return url

    segments.insert(sub_index + 1, str(namespace["slug"]))
    return urlunsplit((parsed.scheme, parsed.netloc, "/".join(segments), parsed.query, parsed.fragment))


def _install_subscription_url_namespace_patch() -> None:
    native_attr = "_zomorod_native_generate_subscription_url"
    native = getattr(UserOperation, native_attr, None)
    if native is None:
        native = UserOperation.generate_subscription_url
        setattr(UserOperation, native_attr, native)

    current = UserOperation.generate_subscription_url
    if getattr(current, "_zomorod_namespace_patch", False):
        return

    async def generate_subscription_url(user):
        url = await native(user)
        admin = getattr(user, "admin", None)
        admin_id = int(getattr(admin, "id", 0) or 0)
        if admin_id <= 0:
            return url
        return _namespace_url_for_admin(url, admin_id)

    generate_subscription_url._zomorod_namespace_patch = True
    UserOperation.generate_subscription_url = staticmethod(generate_subscription_url)


_install_subscription_url_namespace_patch()
'''
              s = s.rstrip() + patch + '\n'
          backend.write_text(s, encoding='utf-8')

          ui = Path('plugin/zomorod-special.js')
          js = ui.read_text(encoding='utf-8')
          old_options = '''    const options = admins.map((admin) => `<option value="${escapeHtml(admin.id)}" data-username="${escapeHtml(admin.username)}">${escapeHtml(admin.username)}</option>`).join('');'''
          new_options = '''    const options = admins.map((admin) => `<option value="${escapeHtml(admin.id)}" data-username="${escapeHtml(admin.username)}" data-user-count="${escapeHtml(Number(admin.user_count || 0))}">${escapeHtml(admin.username)} · ${escapeHtml(Number(admin.user_count || 0))} users</option>`).join('');'''
          if old_options in js:
              js = js.replace(old_options, new_options, 1)
          elif 'data-user-count=' not in js:
              raise SystemExit('namespace admin options anchor not found')

          old_row = '''      return `<div class="z-ns-row" data-z-route="${escapeHtml(route.slug)}"><div class="z-ns-admin">${escapeHtml(route.username)}</div><div class="z-ns-url" title="${escapeHtml(example)}">${escapeHtml(example)}</div><button type="button" class="z-mini-btn z-copy-ns" data-prefix="${escapeHtml(`${location.origin}${route.path_prefix}/`)}">Copy Prefix</button><button type="button" class="z-mini-btn z-danger z-delete-ns" data-slug="${escapeHtml(route.slug)}">Delete</button></div>`;'''
          new_row = '''      const admin = admins.find((item) => Number(item.id) === Number(route.admin_id));\n      const userCount = Number(admin?.user_count || 0);\n      return `<div class="z-ns-row" data-z-route="${escapeHtml(route.slug)}"><div class="z-ns-admin">${escapeHtml(route.username)} <span class="z-native">${escapeHtml(userCount)} users</span></div><div class="z-ns-url" title="${escapeHtml(example)}">${escapeHtml(example)}</div>${userCount === 0 ? '<div class="z-pending">این ادمین فعلاً هیچ User تحت مالکیت خود ندارد؛ ابتدا در PasarGuard برای Userها Set Owner انجام دهید.</div>' : ''}<button type="button" class="z-mini-btn z-copy-ns" data-prefix="${escapeHtml(`${location.origin}${route.path_prefix}/`)}">Copy Prefix</button><button type="button" class="z-mini-btn z-danger z-delete-ns" data-slug="${escapeHtml(route.slug)}">Delete</button></div>`;'''
          if old_row in js:
              js = js.replace(old_row, new_row, 1)
          elif 'userCount === 0' not in js:
              raise SystemExit('namespace row anchor not found')

          old_save = '''        await api('/api/zomorod/admin-subscriptions', { method: 'POST', body: JSON.stringify({ admin_id: Number(select.value), slug: slug.value.trim(), enabled: true }) });\n        cachedNamespaces = await api('/api/zomorod/admin-subscriptions');\n        namespaceError = null;\n        if (cachedSettings) renderOwner(cachedSettings);'''
          new_save = '''        const selectedAdmin = cachedNamespaces?.admins?.find((item) => Number(item.id) === Number(select.value));\n        await api('/api/zomorod/admin-subscriptions', { method: 'POST', body: JSON.stringify({ admin_id: Number(select.value), slug: slug.value.trim(), enabled: true }) });\n        cachedNamespaces = await api('/api/zomorod/admin-subscriptions');\n        namespaceError = null;\n        if (cachedSettings) renderOwner(cachedSettings);\n        if (Number(selectedAdmin?.user_count || 0) === 0) {\n          alert('Namespace ذخیره شد، اما این ادمین هیچ User تحت مالکیت خودش ندارد. ابتدا Userهای موردنظر را در PasarGuard با Set Owner به این ادمین منتقل کنید.');\n        }'''
          if old_save in js:
              js = js.replace(old_save, new_save, 1)
          elif 'selectedAdmin?.user_count' not in js:
              raise SystemExit('namespace save anchor not found')
          ui.write_text(js, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          yml = ci.read_text(encoding='utf-8')
          anchor = "          grep -q 'ZOMOROD_SUPPORT_ID' backend/zomorod_admin_subscriptions.py\n"
          checks = "          grep -q 'ZOMOROD_SUPPORT_ID' backend/zomorod_admin_subscriptions.py\n          grep -q '_zomorod_namespace_patch' backend/zomorod_admin_subscriptions.py\n          grep -q 'func.count(User.id)' backend/zomorod_admin_subscriptions.py\n"
          if "grep -q '_zomorod_namespace_patch'" not in yml:
              if anchor not in yml:
                  raise SystemExit('CI anchor not found')
              yml = yml.replace(anchor, checks, 1)
          ci.write_text(yml, encoding='utf-8')
          PY

          python3 -m py_compile backend/zomorod_admin_subscriptions.py
          node --check plugin/zomorod-special.js

      - name: Commit scoped canonical link fix
        run: |
          if git diff --quiet -- backend/zomorod_admin_subscriptions.py plugin/zomorod-special.js .github/workflows/ci.yml; then
            echo 'Canonical admin subscription link fix already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/zomorod_admin_subscriptions.py plugin/zomorod-special.js .github/workflows/ci.yml
          git commit -m 'fix: generate canonical admin-scoped subscription links [skip canonical-fix]'
          git push origin HEAD:main
