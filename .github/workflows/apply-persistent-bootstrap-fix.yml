name: Apply persistent bootstrap fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_persistent_bootstrap_fix.py
      - .github/workflows/apply-persistent-bootstrap-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bootstrap installer patch
        run: |
          python3 tools/apply_persistent_bootstrap_fix.py
          python3 -m py_compile plugin/sitecustomize.py backend/zomorod_admin_subscriptions.py
          bash -n install.sh
      - name: Commit patched installer and CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist Zomorod backend before PasarGuard startup'
          git push origin HEAD:main
